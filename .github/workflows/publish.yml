name: publish

# Publishes the npm package when a release is published (or manually with a tag).
# Requires the NPM_TOKEN secret in the repository settings.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.2.0"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package version
        run: |
          if [ "${{ steps.version.outputs.tag }}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "tag ${{ steps.version.outputs.tag }} does not match package version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
